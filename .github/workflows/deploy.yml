name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Связность
        run: node scripts/crawl.mjs
      - name: E2E и доступность
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # GitHub Pages отдаёт проектный сайт по /<репозиторий>/, поэтому для
      # публикации сайт пересобирается с этим префиксом и связность проверяется
      # ещё раз — уже на тех адресах, по которым он реально будет жить
      - name: Сборка под подпапку Pages
        env:
          SITE_BASE: ${{ github.event.repository.name }}
        run: npm run build
      - name: Связность под подпапкой
        env:
          SITE_BASE: ${{ github.event.repository.name }}
        run: node scripts/crawl.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
